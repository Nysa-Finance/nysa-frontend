# VPS stack: app (site + /api + daily snapshot) behind Caddy (HTTPS). Settings come from .env next to this file.
services:
  app:
    build:
      context: .
      args:
        VITE_SOLANA_RPC: ${VITE_SOLANA_RPC:?set VITE_SOLANA_RPC in .env}
    env_file: .env
    volumes:
      - data:/data # Farm Points, APY history, market index
    restart: unless-stopped
    # Hardening: read-only filesystem (only /data and /tmp writable), no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 200
    logging: &logs { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      RPC_ORIGIN: ${RPC_ORIGIN:?set RPC_ORIGIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certificates
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # only to listen on 80/443
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logs

volumes:
  data:
  caddy_data:
  caddy_config:
