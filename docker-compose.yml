# VPS stack: Cloudflare Tunnel -> Caddy (security headers) -> app (site + /api + daily snapshot). Settings come from .env.
# No port is published: the tunnel connects out to Cloudflare, which does HTTPS, geoblocking and WAF in front.
services:
  app:
    build:
      context: .
      args:
        VITE_SOLANA_RPC: ${VITE_SOLANA_RPC:?set VITE_SOLANA_RPC in .env}
    env_file: .env
    volumes:
      - data:/data # Farm Points, APY history, market index
    restart: unless-stopped
    # Hardening: read-only filesystem (only /data and /tmp writable), no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 200
    logging: &logs { driver: json-file, options: { max-size: 10m, max-file: "3" } }

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      RPC_ORIGIN: ${RPC_ORIGIN:?set RPC_ORIGIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE] # only to listen on :80 (reachable only through the tunnel)
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logs

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run # public hostname -> http://caddy:80 is set in the Cloudflare dashboard
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on: [caddy]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logs

volumes:
  data:
  caddy_data:
  caddy_config:
