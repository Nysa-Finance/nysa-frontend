# Every 6 hours, copies the Farm Points CSV from the VPS to Cloudflare R2, so the points survive losing the VPS:
# farm-points/latest.csv plus a dated copy per change (farm-points/YYYY/MM/DD/HHMMSSZ.csv). Fails (GitHub emails the
# failure) if the VPS can't be reached or if the total points went down: points only grow, so a smaller total means lost
# data, and the last good copy is kept. Needs secrets R2_ENDPOINT (the bucket's S3 API URL without the bucket name, e.g.
# https://<account id>.eu.r2.cloudflarestorage.com for an EU bucket), R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and the
# variable R2_BUCKET (an R2 API token with Object Read & Write on that bucket only).
# The CSV is read over SSH, not from /api/points: Cloudflare's Bot Fight Mode answers datacenter IPs (Actions runners)
# with 403. VPS_POINTS_SSH_KEY is a key that can only run that read (forced command in the deploy user's authorized_keys,
# README "Farm Points"); VPS_HOST and VPS_KNOWN_HOSTS are the deploy workflow's.
name: Farm Points backup
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions: {} # nothing from the repo: only the SSH key and the R2 credentials
concurrency:
  group: points-backup
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # R2 doesn't take the checksums newer AWS CLIs add by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      BUCKET: ${{ vars.R2_BUCKET }}
      SSH_KEY: ${{ secrets.VPS_POINTS_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Back up to R2
        run: |
          cd "$RUNNER_TEMP"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/points && chmod 600 ~/.ssh/points
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          for i in 1 2 3; do # the VPS answers with the CSV whatever the command (forced command)
            ssh -i ~/.ssh/points -o BatchMode=yes -o ConnectTimeout=30 "deploy@$HOST" > new.csv && break
            [ "$i" = 3 ] && { echo '::error::cannot read the Farm Points from the VPS'; exit 1; }
            sleep 30
          done
          head -1 new.csv | grep -qx 'address,cumulative_points,last_supplied_usd,last_snapshot_ts'
          [ "$(wc -l < new.csv)" -ge 2 ] || { echo '::error::no wallets in the CSV'; exit 1; }
          s3() { aws --endpoint-url "$ENDPOINT" "$@"; }
          # The last backup, to compare with. Only "not there" (first run) counts as empty: any other error stops here,
          # or a failed read would skip the check below.
          if head=$(s3 s3api head-object --bucket "$BUCKET" --key farm-points/latest.csv 2>&1); then
            s3 s3 cp --only-show-errors "s3://$BUCKET/farm-points/latest.csv" old.csv
          elif grep -q '(404)' <<< "$head"; then : > old.csv
          else echo "$head"; exit 1; fi
          total() { awk -F, 'NR > 1 { s += $2 } END { printf "%.6f", s }' "$1"; }
          old=$(total old.csv) new=$(total new.csv)
          awk -v o="$old" -v n="$new" 'BEGIN { exit !(n + 1e-6 >= o) }' || { echo "::error::total points went down ($old -> $new): not overwriting the backup"; exit 1; }
          [ "$(sha256sum < old.csv)" = "$(sha256sum < new.csv)" ] && { echo 'unchanged'; exit 0; }
          s3 s3 cp --only-show-errors new.csv "s3://$BUCKET/farm-points/$(date -u +%Y/%m/%d/%H%M%SZ).csv"
          s3 s3 cp --only-show-errors new.csv "s3://$BUCKET/farm-points/latest.csv"
          echo "backed up: $new points, $(($(wc -l < new.csv) - 1)) wallets"
